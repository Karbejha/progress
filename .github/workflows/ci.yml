name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: progress_daily_regression
          POSTGRES_PASSWORD: regression-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d progress_daily_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Build Nest.js Application
        working-directory: ./server
        run: npm run build

      - name: Prepare Regression Database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:regression-only@localhost:5432/progress_daily_regression?schema=public
        run: npx prisma db push --skip-generate

      - name: Test Daily Progress Calculation
        working-directory: ./server
        env:
          PROGRESS_TEST_DATABASE_URL: postgresql://postgres:regression-only@localhost:5432/progress_daily_regression?schema=public
        run: npm test

  frontend-ci:
    name: Frontend Typecheck & Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./client
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker-build-verification:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: ports-server:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          tags: ports-client:ci-test
