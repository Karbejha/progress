name: CD - Deploy Progress

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: progress-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Windows Server (Optimized Local Build)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Show deployment information
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Progress Production Deployment"
          Write-Host "========================================"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "User:"
          whoami
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Branch: ${{ github.ref_name }}"

      - name: Update production source code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $deployPath = "C:\Docker\progress"
          $branch = "${{ github.ref_name }}"

          Write-Host "Deploy directory: $deployPath"
          Write-Host "Branch: $branch"

          if (-not (Test-Path $deployPath)) {
              throw "Deployment directory does not exist: $deployPath"
          }

          Set-Location $deployPath

          Write-Host "Current commit:"
          git log -1 --oneline

          Write-Host "Fetching latest changes from GitHub..."
          git fetch origin $branch

          Write-Host "Discarding any uncommitted local modifications on the server..."
          git reset --hard

          Write-Host "Checking out branch $branch and aligning with origin/$branch..."
          git checkout $branch
          git reset --hard origin/$branch

          if ($LASTEXITCODE -ne 0) {
              throw "Git sync failed."
          }

          Write-Host "New commit on server:"
          git log -1 --oneline

          $deployedCommit = (git rev-parse HEAD).Trim()
          $expectedCommit = "${{ github.sha }}"

          Write-Host "Expected commit: $expectedCommit"
          Write-Host "Deployed commit: $deployedCommit"

          if ($deployedCommit -ne $expectedCommit) {
              throw "Server repository is not on the expected GitHub commit."
          }

      - name: Validate Docker Compose
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\Docker\progress"

          docker compose config
          if ($LASTEXITCODE -ne 0) {
              throw "docker compose config failed."
          }

      - name: Build and deploy application (Throttled & Optimized)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\Docker\progress"

          # Lower priority to BelowNormal so the build never starves CPU or freezes running services
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = [System.Diagnostics.ProcessPriorityClass]::BelowNormal

          # Enable BuildKit for optimal layer caching
          $env:DOCKER_BUILDKIT = "1"

          Write-Host "Building server container (reusing single-install dependencies)..."
          docker compose build server

          if ($LASTEXITCODE -ne 0) {
              throw "Docker build server failed."
          }

          Write-Host "Building client container (throttled to 1 CPU worker and 1GB RAM)..."
          docker compose build client

          if ($LASTEXITCODE -ne 0) {
              throw "Docker build client failed."
          }

          Write-Host "Starting updated application containers..."
          docker compose up -d client server

          if ($LASTEXITCODE -ne 0) {
              throw "Docker container restart failed."
          }

          Write-Host "Cleaning up dangling images..."
          docker image prune -f

          Write-Host "Deployment finished successfully without CPU/RAM overload!"

      - name: Show container status
        shell: powershell
        run: |
          Set-Location "C:\Docker\progress"

          Write-Host "========================================"
          Write-Host "Container Status"
          Write-Host "========================================"

          docker compose ps

      - name: Show logs if deployment fails
        if: failure()
        shell: powershell
        run: |
          Set-Location "C:\Docker\progress"

          Write-Host "========================================"
          Write-Host "Deployment failed - recent logs"
          Write-Host "========================================"

          docker compose logs --tail=100 client server