name: CD - Build & Deploy Progress

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: progress-production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # Job 1: Build Docker images on GitHub Cloud Runners
  # High CPU/RAM compilation happens in the cloud for free
  # ========================================================
  build-and-push:
    name: Build & Push Images (GitHub Cloud)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Lowercase Image Names
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "server_image=ghcr.io/${REPO_LOWER}/server" >> $GITHUB_OUTPUT
          echo "client_image=ghcr.io/${REPO_LOWER}/client" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.server_image }}:latest
            ${{ steps.prep.outputs.server_image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://progress.gdp.gov.sy/api
          tags: |
            ${{ steps.prep.outputs.client_image }}:latest
            ${{ steps.prep.outputs.client_image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Job 2: Deploy to Production Windows Server
  # Only pulls the ready images and restarts (0% build CPU/Disk)
  # ========================================================
  deploy:
    name: Deploy to Windows Server (Pull & Restart)
    runs-on: [self-hosted, Windows, X64]
    needs: [build-and-push]
    timeout-minutes: 15

    steps:
      - name: Show deployment information
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Progress Production Deployment"
          Write-Host "========================================"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "User:"
          whoami
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Branch: ${{ github.ref_name }}"

      - name: Update production source code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $deployPath = "C:\Docker\progress"
          $branch = "${{ github.ref_name }}"

          Write-Host "Deploy directory: $deployPath"
          Write-Host "Branch: $branch"

          if (-not (Test-Path $deployPath)) {
              throw "Deployment directory does not exist: $deployPath"
          }

          Set-Location $deployPath

          Write-Host "Current commit:"
          git log -1 --oneline

          Write-Host "Fetching changes from GitHub..."
          git fetch origin

          Write-Host "Checking out branch $branch..."
          git checkout $branch

          Write-Host "Pulling latest changes..."
          git pull --ff-only origin $branch

          if ($LASTEXITCODE -ne 0) {
              throw "Git pull failed."
          }

          Write-Host "New commit:"
          git log -1 --oneline

          $deployedCommit = (git rev-parse HEAD).Trim()
          $expectedCommit = "${{ github.sha }}"

          Write-Host "Expected commit: $expectedCommit"
          Write-Host "Deployed commit: $deployedCommit"

          if ($deployedCommit -ne $expectedCommit) {
              throw "Server repository is not on the expected GitHub commit."
          }

      - name: Validate Docker Compose
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\Docker\progress"
          docker compose config
          if ($LASTEXITCODE -ne 0) {
              throw "docker compose config failed."
          }

      - name: Log in to GHCR on Server
        shell: powershell
        run: |
          Write-Host "Authenticating Docker with GitHub Container Registry..."
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $token | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE -ne 0) {
              throw "Docker login to GHCR failed."
          }

      - name: Pull pre-built images and restart containers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "C:\Docker\progress"

          Write-Host "Pulling pre-built containers from GHCR (zero CPU load)..."
          docker compose pull client server

          if ($LASTEXITCODE -ne 0) {
              throw "docker compose pull failed."
          }

          Write-Host "Applying update (restarting containers)..."
          docker compose up -d client server

          if ($LASTEXITCODE -ne 0) {
              throw "Docker container restart failed."
          }

          Write-Host "Cleaning up dangling images..."
          docker image prune -f

          Write-Host "Deployment completed successfully with 0% server build load!"

      - name: Show container status
        shell: powershell
        run: |
          Set-Location "C:\Docker\progress"

          Write-Host "========================================"
          Write-Host "Container Status"
          Write-Host "========================================"

          docker compose ps

      - name: Show logs if deployment fails
        if: failure()
        shell: powershell
        run: |
          Set-Location "C:\Docker\progress"

          Write-Host "========================================"
          Write-Host "Deployment failed - recent logs"
          Write-Host "========================================"

          docker compose logs --tail=100 client server