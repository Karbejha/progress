services:
  postgres:
    image: postgres:16-alpine
    container_name: ports-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ports_daily_system}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ports_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ports_daily_system}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ports_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: ports-server
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ports_daily_system}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      SEED_ON_START: ${SEED_ON_START:-true}

    ports:
      - "${BACKEND_PORT:-4010}:4000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ports_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: ports-client
    restart: unless-stopped

    environment:
      INTERNAL_API_URL: http://server:4000
      PORT: 3000

    ports:
      - "${FRONTEND_PORT:-3010}:3000"

    depends_on:
      - server

    networks:
      - ports_network

volumes:
  ports_pgdata:
    driver: local

networks:
  ports_network:
    driver: bridge
